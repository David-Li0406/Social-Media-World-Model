name: remote-gpu-exp

# Manual trigger only. The self-hosted runner on Machine B picks this up,
# prepares data, runs the SFT training script, and uploads small artifacts.
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to a baseline config YAML"
        required: true
        default: "configs/baseline/llm_sft_qwen3_4b_debug.yaml"
      run_name:
        description: "Experiment name (also the artifact name)"
        required: true
        default: "sft_qwen3_4b_debug"
      data_version:
        description: "Dataset version (bump when prepare_data.sh logic changes)"
        required: true
        default: "v1"
      use_vllm:
        description: "try vLLM for the judge. OFF by default: vllm 0.31 forces torch 2.13, which this runner's CUDA 12.2 driver cannot load. Needs a pinned, cu124-compatible version."
        required: false
        default: "false"
      vllm_spec:
        description: "pip spec when use_vllm is true, e.g. 'vllm==0.7.3'"
        required: false
        default: "vllm"
      lanes:
        description: "benchmark mode only: space-separated lanes to run (blank = all 7)"
        required: false
        default: ""
      mode:
        description: "train, infer, judge, summarize, or benchmark (all 4 GPUs)"
        required: true
        default: "train"
        type: choice
        options: ["train", "infer", "judge", "summarize", "benchmark", "replyforecast", "llmsweep"]

jobs:
  run:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show machine info
        run: |
          hostname
          nvidia-smi || true
          uv --version || echo "uv not found"

      - name: Bootstrap uv
        run: |
          # The self-hosted runner doesn't ship uv. Install it to ~/.local/bin
          # if missing and expose it to all later steps via $GITHUB_PATH.
          if ! command -v uv >/dev/null 2>&1; then
            python3 -m pip install --user -U uv \
              || curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          for d in "$HOME/.local/bin" "$HOME/.cargo/bin"; do
            if [ -x "$d/uv" ]; then echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; fi
          done
          command -v uv
          uv --version

      - name: Setup uv environment
        run: |
          export UV_CACHE_DIR="$HOME/.cache/uv"
          # Pin Python 3.12 (openrlhf wheels). torch is routed to the CUDA 12.4
          # index in pyproject.toml because the runner's driver is CUDA 12.2.
          uv sync --python 3.12 --extra llm_sft --extra retrieval
          # Self-repair: a previous vLLM experiment can leave torch half-replaced
          # -- the torch package restored but its nvidia-* CUDA libraries gone,
          # so `import torch` dies on `from torch._C import *`. A plain sync does
          # not fix that, because uv considers the resolution already satisfied.
          if ! uv run python -c "import torch,sys; sys.exit(0 if torch.cuda.is_available() else 1)" 2>/dev/null; then
            echo "[env] torch/CUDA unusable -- rebuilding the venv from scratch"
            rm -rf .venv
            uv sync --python 3.12 --extra llm_sft --extra retrieval
          fi
          uv run python -c "import torch; print('[env] torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: Install vLLM (optional accelerator, with rollback)
        if: inputs.use_vllm == 'true'
        continue-on-error: true
        run: |
          # The runner's driver is CUDA 12.2, which is why pyproject pins torch
          # to the cu124 index. A bare `uv pip install vllm` drags in a torch
          # built for a newer driver, and torch.cuda.is_available() goes false
          # -- which silently broke every GPU stage of a previous run.
          # So: install, verify, and roll back if torch lost CUDA.
          export UV_CACHE_DIR="$HOME/.cache/uv"
          torch_ok() { uv run python -c "import torch,sys; sys.exit(0 if torch.cuda.is_available() else 1)" 2>/dev/null; }
          if uv pip install "${{ inputs.vllm_spec }}"; then
            if torch_ok; then
              uv run python -c "import vllm,torch; print('[vllm] ok', vllm.__version__, 'torch', torch.__version__)" || true
            else
              echo "[vllm] install broke torch CUDA -- rolling back"
              uv pip uninstall vllm >/dev/null 2>&1 || true
              uv sync --python 3.12 --extra llm_sft --extra retrieval --reinstall-package torch
              torch_ok && echo "[vllm] rollback restored torch CUDA" || echo "[vllm] ROLLBACK FAILED"
            fi
          else
            echo "[vllm] install failed; judge will use transformers"
          fi

      - name: Verify GPU stack (fatal)
        run: |
          # Deliberately NOT continue-on-error: if torch cannot see the GPUs,
          # every lane would fail one by one and the job would still report
          # success. Fail here instead, at the cheapest possible point.
          uv run python - <<'EOF'
          import sys, torch
          print("torch", torch.__version__, "cuda_available", torch.cuda.is_available())
          if not torch.cuda.is_available():
              sys.exit("FATAL: torch cannot see CUDA; aborting before any lane runs")
          print("visible GPUs:", torch.cuda.device_count())
          EOF

      - name: Prepare data
        run: |
          export DATA_ROOT="$HOME/datasets/smwm"
          export DATA_VERSION="${{ inputs.data_version }}"
          export HF_HOME="$HOME/hf_cache"
          export HF_DATASETS_CACHE="$HF_HOME/datasets"
          export TRANSFORMERS_CACHE="$HF_HOME/transformers"
          ./scripts/prepare_data.sh

      - name: Run experiment
        env:
          HUGGING_FACE: ${{ secrets.HUGGING_FACE }}
        run: |
          export DATA_ROOT="$HOME/datasets/smwm"
          export HF_HOME="$HOME/hf_cache"
          export HF_DATASETS_CACHE="$HF_HOME/datasets"
          export TRANSFORMERS_CACHE="$HF_HOME/transformers"
          export CUDA_VISIBLE_DEVICES=4,5,6,7
          CONFIG="${{ inputs.config }}" \
          RUN_NAME="${{ inputs.run_name }}" \
          MODE="${{ inputs.mode }}" \
          LANES="${{ inputs.lanes }}" \
            ./scripts/gpu_run.sh

      - name: Write summary
        if: always()
        run: |
          RUN="${{ inputs.run_name }}"
          echo "## Experiment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Config: ${{ inputs.config }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run name: ${{ inputs.run_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Data version: ${{ inputs.data_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "runs/$RUN/metrics.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "runs/$RUN/metrics.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_name }}-${{ inputs.mode }}
          path: |
            runs/${{ inputs.run_name }}/train.log
            runs/${{ inputs.run_name }}/metrics.json
            runs/${{ inputs.run_name }}/config.yaml
            runs/${{ inputs.run_name }}/predictions.jsonl
            runs/${{ inputs.run_name }}/judge_summary.json
            runs/${{ inputs.run_name }}/judge_ratings.jsonl
            runs/${{ inputs.run_name }}/summaries.jsonl
            runs/${{ inputs.run_name }}/metrics.txt
            runs/${{ inputs.run_name }}/judge_summary.json
            runs/${{ inputs.run_name }}/*.log
            runs/${{ inputs.run_name }}/*.jsonl
