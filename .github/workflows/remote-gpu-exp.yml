name: remote-gpu-exp

# Manual trigger only. The self-hosted runner on Machine B picks this up,
# prepares data, runs the SFT training script, and uploads small artifacts.
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to a baseline config YAML"
        required: true
        default: "configs/baseline/llm_sft_qwen3_4b_debug.yaml"
      run_name:
        description: "Experiment name (also the artifact name)"
        required: true
        default: "sft_qwen3_4b_debug"
      data_version:
        description: "Dataset version (bump when prepare_data.sh logic changes)"
        required: true
        default: "v1"
      lanes:
        description: "benchmark mode only: space-separated lanes to run (blank = all 7)"
        required: false
        default: ""
      mode:
        description: "train, infer, judge, summarize, or benchmark (all 4 GPUs)"
        required: true
        default: "train"
        type: choice
        options: ["train", "infer", "judge", "summarize", "benchmark", "replyforecast"]

jobs:
  run:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show machine info
        run: |
          hostname
          nvidia-smi || true
          uv --version || echo "uv not found"

      - name: Bootstrap uv
        run: |
          # The self-hosted runner doesn't ship uv. Install it to ~/.local/bin
          # if missing and expose it to all later steps via $GITHUB_PATH.
          if ! command -v uv >/dev/null 2>&1; then
            python3 -m pip install --user -U uv \
              || curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          for d in "$HOME/.local/bin" "$HOME/.cargo/bin"; do
            if [ -x "$d/uv" ]; then echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"; fi
          done
          command -v uv
          uv --version

      - name: Setup uv environment
        run: |
          export UV_CACHE_DIR="$HOME/.cache/uv"
          # Pin Python 3.12 (openrlhf wheels). torch is routed to the CUDA 12.1
          # index in pyproject.toml ([tool.uv.sources]) because the runner's
          # driver is CUDA 12.2 and the default cu13 wheel reports "driver too
          # old"; cu121 is forward-compatible with 12.2.
          uv sync --python 3.12 --extra llm_sft --extra retrieval

      - name: Install vLLM (optional accelerator)
        continue-on-error: true
        run: |
          # Installed in its own non-fatal step rather than folded into the main
          # sync: vLLM pins torch tightly, and a resolution failure here must not
          # take down the whole job. judge_reply_predictions.py falls back to
          # transformers when vLLM is not importable.
          export UV_CACHE_DIR="$HOME/.cache/uv"
          uv pip install vllm || echo "[vllm] install failed; judge will use transformers"
          uv run python -c "import vllm, torch; print('vllm', vllm.__version__, 'torch', torch.__version__)" \
            || echo "[vllm] not importable"
          uv run python -c "import torch; assert torch.cuda.is_available(); print('torch CUDA still OK')"

      - name: Prepare data
        run: |
          export DATA_ROOT="$HOME/datasets/smwm"
          export DATA_VERSION="${{ inputs.data_version }}"
          export HF_HOME="$HOME/hf_cache"
          export HF_DATASETS_CACHE="$HF_HOME/datasets"
          export TRANSFORMERS_CACHE="$HF_HOME/transformers"
          ./scripts/prepare_data.sh

      - name: Run experiment
        env:
          HUGGING_FACE: ${{ secrets.HUGGING_FACE }}
        run: |
          export DATA_ROOT="$HOME/datasets/smwm"
          export HF_HOME="$HOME/hf_cache"
          export HF_DATASETS_CACHE="$HF_HOME/datasets"
          export TRANSFORMERS_CACHE="$HF_HOME/transformers"
          export CUDA_VISIBLE_DEVICES=4,5,6,7
          CONFIG="${{ inputs.config }}" \
          RUN_NAME="${{ inputs.run_name }}" \
          MODE="${{ inputs.mode }}" \
          LANES="${{ inputs.lanes }}" \
            ./scripts/gpu_run.sh

      - name: Write summary
        if: always()
        run: |
          RUN="${{ inputs.run_name }}"
          echo "## Experiment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Config: ${{ inputs.config }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run name: ${{ inputs.run_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Data version: ${{ inputs.data_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "runs/$RUN/metrics.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "runs/$RUN/metrics.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_name }}-${{ inputs.mode }}
          path: |
            runs/${{ inputs.run_name }}/train.log
            runs/${{ inputs.run_name }}/metrics.json
            runs/${{ inputs.run_name }}/config.yaml
            runs/${{ inputs.run_name }}/predictions.jsonl
            runs/${{ inputs.run_name }}/judge_summary.json
            runs/${{ inputs.run_name }}/judge_ratings.jsonl
            runs/${{ inputs.run_name }}/summaries.jsonl
            runs/${{ inputs.run_name }}/metrics.txt
            runs/${{ inputs.run_name }}/judge_summary.json
            runs/${{ inputs.run_name }}/*.log
            runs/${{ inputs.run_name }}/*.jsonl
